name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/XiaoYuRun-v2.0.1-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/XiaoYuRun-v2.0.1-debug.apk
          ls -la dist/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XiaoYuRun-APKs
          path: dist/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1
          name: "小雨run v2.0.1 (稳定修复版)"
          body: |
            ### 小雨run v2.0.1 正式发布 🎉

            极简、优雅的校园运动辅助客户端，遵循 Apple 人机交互设计规范（HIG）全新重构。

            #### 本次修复与升级 (v2.0.1)
            - 🐛 **修复启动闪退**：修正由于 `btnToggleScript`、`tvCredit` 与 `tvScriptPath` ID 未对齐引发的 NullPointerException 闪退问题。
            - 🎨 **全新 Apple 风格图标**：由蓝色大肥鱼旧标全新升级为「小雨疾驰」极简 Apple 风格矢量应用图标，覆盖所有分辨率。
            - 🛡️ **动态跑道防空保护**：为 `TrackCanvasView` 增加尺寸校验，防止界面初始测量阶段空指针。

            #### 下载安装
            - **[XiaoYuRun-v2.0.1-release.apk](https://github.com/yhan-sun/xiaoyu-run/releases/download/v2.0.1/XiaoYuRun-v2.0.1-release.apk)** (推荐)
            - **[XiaoYuRun-v2.0.1-debug.apk](https://github.com/yhan-sun/xiaoyu-run/releases/download/v2.0.1/XiaoYuRun-v2.0.1-debug.apk)**
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
