name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/XiaoYuRun-v2.0.2-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/XiaoYuRun-v2.0.2-debug.apk
          ls -la dist/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XiaoYuRun-APKs
          path: dist/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.2
          name: "小雨run v2.0.2 (稳定修复版)"
          body: |
            ### 小雨run v2.0.2 正式发布 🎉

            极简、优雅的校园运动辅助客户端，遵循 Apple 人机交互设计规范（HIG）全新重构。

            #### 本次修复与升级 (v2.0.2)
            - 🐛 **修复启动闪退**：补齐 `btnToggleScript` / `tvCredit` / `tvScriptPath` 缺失的布局 ID，消除 `onCreate` 阶段的 NullPointerException。
            - 🩺 **启动异常可视化（新增）**：整个启动流程加了兜底捕获——万一还有异常，不再无声闪退，而是弹框显示并自动把堆栈复制到剪贴板，方便反馈定位。
            - 🩺 **崩溃自动留档（新增）**：未捕获异常会写入本地 `last_crash.txt`，下次启动自动弹窗展示。
            - 🎨 **全新 Apple 风格图标**：蓝色渐变 + 极简奔跑几何主体，覆盖全部五档像素密度与自适应图标图层。
            - 🛡️ **跑道视图防空保护**：`TrackCanvasView` 增加尺寸与周长校验，杜绝测量阶段除零。

            #### 下载安装
            - **[XiaoYuRun-v2.0.2-release.apk](https://github.com/yhan-sun/xiaoyu-run/releases/download/v2.0.2/XiaoYuRun-v2.0.2-release.apk)** (推荐)
            - **[XiaoYuRun-v2.0.2-debug.apk](https://github.com/yhan-sun/xiaoyu-run/releases/download/v2.0.2/XiaoYuRun-v2.0.2-debug.apk)**
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
