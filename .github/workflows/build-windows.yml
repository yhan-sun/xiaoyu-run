name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "pc-tool/**"
      - "crates/wxopenid/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Tauri Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install npm deps
        working-directory: desktop
        run: npm ci

      - name: Rust unit tests
        working-directory: desktop/src-tauri
        run: cargo test --quiet

      - name: Build extractor GUI (xiaoyu-run.exe)
        working-directory: pc-tool/src-tauri
        run: cargo build --release

      - name: Build EXE / installer
        working-directory: desktop
        run: npx tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          # 只收独立取码工具，避免与 Tauri 的同名裸 exe 混淆
          Copy-Item "pc-tool/src-tauri/target/release/xiaoyu-run.exe" out/ -ErrorAction Stop
          Copy-Item "desktop/src-tauri/target/release/bundle/nsis/*.exe" out/ -ErrorAction SilentlyContinue
          Copy-Item "desktop/src-tauri/target/release/bundle/msi/*.msi" out/ -ErrorAction SilentlyContinue
          Get-ChildItem out | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyu-run-windows
          path: out/*
          retention-days: 30

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.0-win
          name: "小雨run v3.1.0 · Windows（电脑端取码）"
          body: |
            小雨run 电脑端 · Windows

            **xiaoyu-run.exe** —— 独立取码工具（小窗口）。打开后点「获取 OpenID」，
            界面里给出 OpenID 与二维码；没权限或缺缓存会直接提示怎么处理。

            `XiaoYuRun_*_x64-setup.exe` / `.msi` 是完整界面版（含打卡、成绩等）。

            #### 使用
            1. 在电脑微信里打开一次「重邮智慧体育」小程序并完成绑定
            2. 双击 xiaoyu-run.exe
            3. 点「获取 OpenID」→ 得到 OpenID 与二维码
            4. 手机打开小雨run，扫码或粘贴即可

            小程序数据在手机上是私有的，未 root 无法读取，所以这一步必须在电脑上做。
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
