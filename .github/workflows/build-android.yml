name: Build Android APK (Tauri)

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Tauri Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # 只保留 arm64：覆盖 2016 年之后几乎所有安卓手机，
          # 交叉编译时间降到原来的约 1/4
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install NDK
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          NDK_VER=$(sdkmanager --list 2>/dev/null \
            | grep -oE 'ndk;2[67]\.[0-9.]+' | sort -uV | tail -1 | cut -d';' -f2)
          if [ -z "$NDK_VER" ]; then
            NDK_VER=27.0.12077973
          fi
          echo "安装 NDK $NDK_VER"
          sdkmanager "ndk;$NDK_VER" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk"

      - name: Install Tauri host deps (for unit tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - name: Install npm deps
        working-directory: desktop
        run: npm ci

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      - name: Rust unit tests
        working-directory: desktop/src-tauri
        run: cargo test --quiet

      - name: Init Android project
        working-directory: desktop
        run: npx tauri android init --ci --skip-targets-install

      - name: Configure Android scanner and release optimization
        run: python3 desktop/scripts/configure-android.py

      - name: Build APK
        working-directory: desktop
        run: npx tauri android build --apk --target aarch64

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p out
          find desktop/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -print -exec cp {} out/ \;
          ls -lh out

      - name: Verify scanner classes and bundled model
        run: python3 desktop/scripts/verify-android-scanner.py out/*.apk

      - name: Sign unsigned APKs (debug keystore)
        run: |
          set -e
          SDK="$ANDROID_HOME/build-tools/34.0.0"
          if [ ! -x "$SDK/apksigner" ]; then SDK="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | tail -1)"; fi
          # 用仓库里固定的 keystore，保证每次构建签名一致 —— 否则每次升级
          # 都要先卸载旧版（INSTALL_FAILED_UPDATE_INCOMPATIBLE）
          KS="desktop/.signing/debug.keystore"
          if [ ! -f "$KS" ]; then
            echo "缺少签名文件 $KS" >&2
            exit 1
          fi
          for f in out/*.apk; do
            if ! "$SDK/apksigner" verify "$f" > /dev/null 2>&1; then
              echo "签名 $f"
              "$SDK/zipalign" -f 4 "$f" "$f.aligned"
              "$SDK/apksigner" sign --ks "$KS" --ks-pass pass:android \
                --key-pass pass:android --ks-key-alias androiddebugkey \
                --out "${f%.apk}-signed.apk" "$f.aligned"
              rm -f "$f" "$f.aligned"
            fi
          done
          # 只出 arm64，给个不含糊的名字（Tauri 默认产物叫 universal）
          for f in out/*signed.apk; do
            [ -e "$f" ] || continue
            mv "$f" out/XiaoYuRun-arm64.apk
          done
          ls -lh out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyu-run-android
          path: out/*.apk
          retention-days: 30

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.2.5-android
          name: "小雨run v3.2.5 · Android"
          body: |
            小雨run v3.2.5（Rust + Tauri 重写）· Android arm64 版

            #### 本版更新
            - 点击停止时，如果查询已有记录的请求仍在进行，即使该查询失败也会尝试结算已知记录。
            - 修复连续启动时可能出现的并发问题；模拟测试覆盖正常结算、停止及 403 响应。
            - 改进配置保存、读取错误提示及导入时序；使用相同签名覆盖安装可保留本机数据。
            - 上次成功同步的成绩会在启动时显示；场地和规则会在启动后重新同步。
            - HTTP 403 的服务端拦截原因仍未确认，无法保证结算成功；收到 403 时请在官方小程序检查记录。
            - 两座场地的七道跑道为地图与围栏估算，并非实测坐标。

            #### 适用机型
            仅 arm64（arm64-v8a），覆盖 2016 年后几乎所有安卓手机。

            #### 安装
            下载下方 APK，传到手机安装。首次安装需允许「安装未知来源应用」。

            #### 使用注意
            - 打卡期间请**保持应用在前台**，可把亮度调低
            - 切到后台或锁屏可能被系统挂起，导致打卡中断
            - 人脸核验在操场摄像头侧完成，工具无法绕开，需本人到场
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
