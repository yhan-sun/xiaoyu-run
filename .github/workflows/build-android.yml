name: Build Android APK (Tauri)

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Tauri Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install NDK
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          NDK_VER=$(sdkmanager --list 2>/dev/null \
            | grep -oE 'ndk;2[67]\.[0-9.]+' | sort -uV | tail -1 | cut -d';' -f2)
          if [ -z "$NDK_VER" ]; then
            NDK_VER=27.0.12077973
          fi
          echo "安装 NDK $NDK_VER"
          sdkmanager "ndk;$NDK_VER" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk"

      - name: Install Tauri host deps (for unit tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - name: Install npm deps
        working-directory: desktop
        run: npm ci

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      - name: Rust unit tests
        working-directory: desktop/src-tauri
        run: cargo test --quiet

      - name: Init Android project
        working-directory: desktop
        run: npx tauri android init --ci --skip-targets-install

      - name: Build APK
        working-directory: desktop
        run: npx tauri android build --apk

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p out
          find desktop/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -print -exec cp {} out/ \;
          ls -lh out

      - name: Sign unsigned APKs (debug keystore)
        run: |
          set -e
          SDK="$ANDROID_HOME/build-tools/34.0.0"
          if [ ! -x "$SDK/apksigner" ]; then SDK="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | tail -1)"; fi
          KS="$HOME/debug.keystore"
          keytool -genkeypair -v -keystore "$KS" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" > /dev/null 2>&1 || true
          for f in out/*.apk; do
            if ! "$SDK/apksigner" verify "$f" > /dev/null 2>&1; then
              echo "签名 $f"
              "$SDK/zipalign" -f 4 "$f" "$f.aligned"
              "$SDK/apksigner" sign --ks "$KS" --ks-pass pass:android \
                --key-pass pass:android --ks-key-alias androiddebugkey \
                --out "${f%.apk}-signed.apk" "$f.aligned"
              rm -f "$f" "$f.aligned"
            fi
          done
          ls -lh out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyu-run-android
          path: out/*.apk
          retention-days: 30

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-android
          name: "小雨run v3.0.0 · Android"
          body: |
            小雨run v3.0.0（Rust + Tauri 重写）· Android 版

            #### 安装
            下载下方 APK，传到手机安装。首次安装需允许「安装未知来源应用」。

            #### 使用注意
            - 打卡期间请**保持应用在前台**，可把亮度调低
            - 切到后台或锁屏可能被系统挂起，导致打卡中断
            - 人脸核验在操场摄像头侧完成，工具无法绕开，需本人到场
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
