[package]
name = "xiaoyu-run"
version = "3.1.0"
description = "小雨run · 校园运动客户端"
authors = ["小雨"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "xiaoyu_run_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", features = ["tls", "gzip"] }
chrono = "0.4"
qrcode = { version = "0.14", default-features = false }
tauri-plugin-barcode-scanner = "2"
wxopenid = { path = "../../crates/wxopenid" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
